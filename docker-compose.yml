x-openclaw-build: &openclaw-build
  build:
    context: .
    dockerfile: Dockerfile.openclaw

services:
  pinchy:
    build:
      context: .
      dockerfile: Dockerfile.pinchy
    ports:
      - "${PINCHY_PORT:-7777}:7777"
    environment:
      - DATABASE_URL=postgresql://pinchy:${DB_PASSWORD:-pinchy_dev}@db:5432/pinchy
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:${PINCHY_PORT:-7777}}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - PINCHY_ENTERPRISE_KEY=${PINCHY_ENTERPRISE_KEY:-}
      - OPENCLAW_IMAGE=${OPENCLAW_IMAGE:-pinchy-openclaw}
      - DOCKER_NETWORK=${DOCKER_NETWORK:-pinchy_default}
      - OPENCLAW_WS_URL=ws://openclaw:18789
      - OPENCLAW_CONFIG_PATH=/openclaw-config/openclaw.json
      - GATEWAY_TOKEN_PATH=/openclaw-config/gateway-token
    volumes:
      - pinchy-secrets:/app/secrets
      - openclaw-config:/openclaw-config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      openclaw:
        condition: service_started

  openclaw:
    <<: *openclaw-build
    volumes:
      - openclaw-config:/root/.openclaw
      - openclaw-workspaces:/root/.openclaw/workspaces
    restart: unless-stopped

  db:
    image: postgres:17
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=pinchy
      - POSTGRES_USER=pinchy
      - POSTGRES_PASSWORD=${DB_PASSWORD:-pinchy_dev}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinchy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pinchy-secrets:
  openclaw-config:
  openclaw-workspaces:
